name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate semantic version tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
      - name: Download Go dependencies
        run: go mod download
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$unformatted" || { echo "Run gofmt on:"; echo "$unformatted"; exit 1; }
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Go build
        run: go build ./...
      - name: Verify frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run test:helpers
          npm run build

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...

  build-windows-amd64:
    name: Package Windows amd64
    needs: [verify-linux, verify-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded production frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        shell: pwsh
        run: |
          $buildTime = Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ"
          $ldflags = "-s -w -X gamenode/internal/diagnostics.Version=${{ github.ref_name }} -X gamenode/internal/diagnostics.Commit=${{ github.sha }} -X gamenode/internal/diagnostics.BuildTime=$buildTime"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags $ldflags -o dist/gamenode-windows-amd64.exe ./cmd/gamenode
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/gamenode-windows-amd64.exe
          if-no-files-found: error
          retention-days: 1

  build-linux-amd64:
    name: Package Linux amd64
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded production frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        run: |
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ldflags="-s -w -X gamenode/internal/diagnostics.Version=${GITHUB_REF_NAME} -X gamenode/internal/diagnostics.Commit=${GITHUB_SHA} -X gamenode/internal/diagnostics.BuildTime=${build_time}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/gamenode-linux-amd64 ./cmd/gamenode
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/gamenode-linux-amd64
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [build-windows-amd64, build-linux-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum gamenode-windows-amd64.exe gamenode-linux-amd64 > SHA256SUMS.txt
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/gamenode-windows-amd64.exe release/gamenode-linux-amd64 release/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
