name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go fmt, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*'))"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  go-race:
    name: Go race detector (Linux amd64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
      - name: Run race-enabled tests
        run: go test -race ./...

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build frontend
        run: npm run build

  build-windows-amd64:
    name: Windows amd64 build
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build embedded frontend
        working-directory: web
        run: npm run build
      - name: Build Windows binary
        run: go build -o dist/gamenode-windows-amd64.exe ./cmd/gamenode
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenode-windows-amd64
          path: dist/gamenode-windows-amd64.exe
          if-no-files-found: error

  build-linux-amd64:
    name: Linux amd64 build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          check-latest: true
          cache: true
      - name: Build embedded frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -o dist/gamenode-linux-amd64 ./cmd/gamenode
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenode-linux-amd64
          path: dist/gamenode-linux-amd64
          if-no-files-found: error
