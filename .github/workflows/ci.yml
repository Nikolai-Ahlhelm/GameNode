name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$unformatted" || { echo "Run gofmt on:"; echo "$unformatted"; exit 1; }
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...

  go-race:
    name: Go race detector (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Helper tests
        run: npm run test:helpers
      - name: Production build
        run: npm run build

  build-windows-amd64:
    name: Build Windows amd64
    needs: [backend-linux, backend-windows, go-race, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded production frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Windows binary
        shell: pwsh
        run: |
          $buildTime = Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ"
          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $ldflags = "-s -w -X gamenode/internal/diagnostics.Version=dev-$shortSha -X gamenode/internal/diagnostics.Commit=${{ github.sha }} -X gamenode/internal/diagnostics.BuildTime=$buildTime"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags $ldflags -o dist/gamenode-windows-amd64.exe ./cmd/gamenode
      - name: Upload development artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gamenode-windows-amd64
          path: dist/gamenode-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-amd64:
    name: Build Linux amd64
    needs: [backend-linux, backend-windows, go-race, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded production frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Linux binary
        run: |
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA::12}"
          ldflags="-s -w -X gamenode/internal/diagnostics.Version=dev-${short_sha} -X gamenode/internal/diagnostics.Commit=${GITHUB_SHA} -X gamenode/internal/diagnostics.BuildTime=${build_time}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/gamenode-linux-amd64 ./cmd/gamenode
      - name: Upload development artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gamenode-linux-amd64
          path: dist/gamenode-linux-amd64
          if-no-files-found: error
          retention-days: 14
